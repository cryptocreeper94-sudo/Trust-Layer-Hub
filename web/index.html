<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Trust Layer Hub</title>
    <meta name="theme-color" content="#0c1224" />
    <meta name="description" content="The front door to the Trust Layer blockchain ecosystem. Manage your Signal (SIG) wallet, access 38 ecosystem apps, chat securely, and verify on-chain." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trust Layer" />
    <link rel="apple-touch-icon" href="/assets/images/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background-color: #0c1224; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  
  <!-- UNIVERSAL PWA BACK-BUTTON PATCH -->
  <script>
    window.addEventListener('load', function() {
      if (window.history && window.history.pushState) {
        window.history.pushState({ pwa: true }, '');
        window.addEventListener('popstate', function(e) {
          window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', code: 'Escape', keyCode: 27, which: 27 }));
          const modals = document.querySelectorAll('.modal, [role="dialog"], .overlay, .popup, [data-state="open"]');
          modals.forEach(m => {
            const btn = m.querySelector('button.close, [aria-label="Close"], .close-button, [data-dismiss="modal"]');
            if (btn && typeof btn.click === 'function') btn.click();
          });
          window.history.pushState({ pwa: true }, '');
        });
      }
    });
  </script>

</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").then(
            function (reg) { console.log("SW registered:", reg.scope); },
            function (err) { console.log("SW registration failed:", err); }
          );
        });
      }
    </script>
      <!-- DarkWave Studios Ecosystem Analytics -->
    <script>
      (function(){
        var id = window.location.hostname;
        function track(type) {
          try { navigator.sendBeacon('https://darkwavestudios.io/api/analytics', JSON.stringify({ app: id, type: type, url: window.location.href, ref: document.referrer, ts: Date.now() })); } catch(e) {}
        }
        track('pageview');
        window.addEventListener('popstate', function(){ track('navigate'); });
        var origPush = history.pushState;
        history.pushState = function(){ origPush.apply(this, arguments); track('navigate'); };
      })();
    </script>
  </body>
</html>
